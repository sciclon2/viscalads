[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viscalads"
version = "1.2.0"
description = "Local-first football match history, statistics and balanced team tools."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Private"}
authors = [{name = "New Kids on Sarrià"}]

[project.scripts]
viscalads = "sciclon2.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
